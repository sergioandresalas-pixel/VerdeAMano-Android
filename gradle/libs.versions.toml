[versions]
kotlin = "2.4.21"
agp = "9.4.1"
ksp = "2.3.12"
hilt = "2.60.1"
ktor = "3.6.0"
serialization = "1.11.0"
coroutines = "1.11.0"
compose = "2026.09.00"
lifecycle = "2.11.0"
navigation = "2.10.2"
firebase-bom = "34.19.0"
firebase-admin = "9.11.0"
google-services = "4.4.4"
credentials = "1.6.0"
googleid = "1.1.1"

[libraries]
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
